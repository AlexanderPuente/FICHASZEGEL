  .brand-text{font-family:'Archivo Black';font-size:15px;letter-spacing:0.5px;line-height:1.15;}
  .brand-text span{display:block;font-family:'Work Sans';font-weight:500;font-size:10.5px;letter-spacing:1.5px;color:#D9C4D2;text-transform:uppercase;margin-top:1px;}
  .counter{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:100px;
    padding:6px 14px;
    font-family:'IBM Plex Mono';font-weight:600;font-size:13px;
    display:flex;align-items:center;gap:6px;
  }
  .counter .dot{width:6px;height:6px;border-radius:50%;background:var(--red);}

  /* ===== Capture card ===== */
  .capture{
    background:var(--paper);
    border-radius:18px;
    padding:26px 20px;
    text-align:center;
    border:2px dashed #C9B7C3;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .capture:active{transform:scale(0.99);}
  .capture.dragover{border-color:var(--red);}
  .capture-icon{
    width:56px;height:56px;margin:0 auto 14px;
    border-radius:50%;background:var(--purple);
    display:flex;align-items:center;justify-content:center;
  }
  .capture-icon svg{width:26px;height:26px;stroke:#fff;}
  .capture h2{font-family:'Archivo Black';font-size:17px;margin:0 0 6px;color:var(--purple-dark);}
  .capture p{margin:0;font-size:13px;color:var(--muted);}
  #fileInput{display:none;}
  .fallback-link{
    display:block;width:100%;background:none;border:none;
    color:#D9C4D2;font-family:'Work Sans';font-size:12.5px;text-decoration:underline;
    padding:10px 4px 0;cursor:pointer;text-align:center;
  }

  /* ===== Camera overlay ===== */
  .camera-overlay{
    position:fixed;inset:0;background:#000;z-index:1000;
    display:none;flex-direction:column;
  }
  .camera-overlay.show{display:flex;}
  #cameraVideo{
    flex:1;width:100%;height:100%;object-fit:cover;
  }
  .camera-frame{
    position:absolute;left:6%;right:6%;top:14%;bottom:22%;
    border:2px solid rgba(255,255,255,0.55);
    border-radius:14px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0.35);
    pointer-events:none;
  }
  .camera-top{
    position:absolute;top:0;left:0;right:0;
    padding:16px 16px 0;
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(rgba(0,0,0,0.55), transparent);
  }
  .cam-close{
    width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(0,0,0,0.45);color:#fff;font-size:16px;cursor:pointer;
    flex-shrink:0;
  }
  .camera-hint{color:#fff;font-family:'Work Sans';font-size:12.5px;opacity:0.85;}
  .camera-controls{
    position:absolute;bottom:0;left:0;right:0;
    padding:18px 24px 34px;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(transparent, rgba(0,0,0,0.55));
  }
  .cam-shutter{
    width:70px;height:70px;border-radius:50%;
    background:rgba(255,255,255,0.15);border:3px solid #fff;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .cam-shutter span{
    width:56px;height:56px;border-radius:50%;background:#fff;
  }
  .cam-shutter:active span{background:#e8e8e8;}
  .cam-flip{
    width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.5);
    background:rgba(0,0,0,0.3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .cam-flip svg{width:20px;height:20px;}

  /* ===== Status ===== */
  .status{
    margin-top:14px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:12px;
    padding:14px 16px;
    color:#fff;
    font-size:13.5px;
    display:none;
    align-items:center;
    gap:10px;
  }
  .status.show{display:flex;}
  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;
    animation:spin .7s linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .status.error{background:rgba(228,54,59,0.18);border-color:rgba(228,54,59,0.4);}

  /* ===== Ficha card (review/edit) ===== */
  .ficha-card{
    margin-top:16px;
    background:var(--paper);
    border-radius:4px 16px 16px 4px;
    position:relative;
    display:none;
    overflow:hidden;
    box-shadow:0 14px 30px rgba(0,0,0,0.28);
  }
  .ficha-card.show{display:block;}
  .ficha-perf{
    position:absolute;left:0;top:0;bottom:0;width:14px;
    background-image: radial-gradient(circle, var(--purple-dark) 3px, transparent 3.2px);
    background-size:14px 16px;
    background-position:center;
    background-color:var(--purple);
  }
  .ficha-body{padding:20px 18px 20px 30px;}
  .ficha-tag{
    display:inline-block;font-family:'IBM Plex Mono';font-size:11px;font-weight:600;
    color:var(--red);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;
  }
  .field{margin-bottom:13px;}
  .field label{
    display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;
    letter-spacing:0.6px;color:var(--muted);margin-bottom:4px;
  }
  .field input, .field select{
    width:100%;border:none;border-bottom:1.5px solid var(--paper-line);
    background:transparent;font-family:'Work Sans';font-size:15px;font-weight:500;
    padding:4px 2px 6px;color:var(--ink);outline:none;
  }
  .field input:focus, .field select:focus{border-bottom-color:var(--purple);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .ficha-actions{display:flex;gap:10px;margin-top:16px;}
  .btn{
    flex:1;border:none;border-radius:10px;padding:12px;
    font-family:'Work Sans';font-weight:700;font-size:14px;cursor:pointer;
  }
  .btn-primary{background:var(--purple);color:#fff;}
  .btn-primary:active{background:var(--purple-dark);}
  .btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--paper-line);}

  /* ===== List / export ===== */
  .section-title{
    color:#fff;font-family:'Archivo Black';font-size:14px;
    margin:26px 2px 10px;display:flex;align-items:center;justify-content:space-between;
  }
  .section-title span{font-family:'IBM Plex Mono';font-weight:500;font-size:12px;color:#D9C4D2;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .list-item{
    background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;padding:11px 14px;color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .li-main{overflow:hidden;}
  .li-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .li-sub{font-size:11.5px;color:#D9C4D2;font-family:'IBM Plex Mono';margin-top:2px;}
  .li-del{
    background:none;border:none;color:#D9C4D2;font-size:18px;cursor:pointer;padding:4px 6px;
    flex-shrink:0;
  }
  .empty{color:#D9C4D2;font-size:13px;text-align:center;padding:20px 10px;opacity:0.8;}

  .export-btn{
    width:100%;margin-top:16px;background:var(--red);color:#fff;border:none;
    border-radius:12px;padding:15px;font-family:'Archivo Black';font-size:14px;
    letter-spacing:0.4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .export-btn:disabled{opacity:0.4;}
  .export-btn svg{width:16px;height:16px;stroke:#fff;}

  input[capture]{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">FICHAS<br>FERIA<span>Zegel · Captura rápida</span></div>
    </div>
    <div class="counter"><span class="dot"></span><span id="countLabel">0</span></div>
  </header>

  <div class="capture" id="captureBtn">
    <div class="capture-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
        <circle cx="12" cy="13" r="3.5"/>
      </svg>
    </div>
    <h2>Fotografiar ficha</h2>
    <p>Toca aquí para abrir la cámara y capturar la ficha</p>
  </div>
  <button class="fallback-link" id="fallbackLink">¿No se abre la cámara? Elegir foto del dispositivo</button>
  <input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none">

  <div class="camera-overlay" id="cameraOverlay">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="camera-frame"></div>
    <div class="camera-top">
      <button class="cam-close" id="cameraCancel">✕</button>
      <span class="camera-hint">Encuadra la ficha completa</span>
    </div>
    <div class="camera-controls">
      <button class="cam-flip" id="cameraFlip" title="Cambiar cámara">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 12a9 9 0 0 1-15 6.7L3 16m0 0v5m0-5h5m13-8V3m0 5h-5"/></svg>
      </button>
      <button class="cam-shutter" id="cameraShutter"><span></span></button>
      <div style="width:44px"></div>
    </div>
  </div>
  <canvas id="cameraCanvas" style="display:none"></canvas>

  <div class="status" id="statusBox">
    <div class="spinner" id="statusSpinner"></div>
    <span id="statusText">Leyendo ficha…</span>
  </div>

  <div class="ficha-card" id="fichaCard">
    <div class="ficha-perf"></div>
    <div class="ficha-body">
      <span class="ficha-tag">Revisa y corrige</span>

      <div class="field">
        <label>Nombres y Apellidos</label>
        <input id="f_nombres" type="text">
      </div>
      <div class="row2">
        <div class="field">
          <label>DNI</label>
          <input id="f_dni" type="text" inputmode="numeric">
        </div>
        <div class="field">
          <label>Celular</label>
          <input id="f_celular" type="text" inputmode="tel">
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <input id="f_email" type="email">
      </div>
      <div class="row2">
        <div class="field">
          <label>Distrito</label>
          <input id="f_distrito" type="text">
        </div>
        <div class="field">
          <label>Grado</label>
          <select id="f_grado">
            <option value="">—</option>
            <option value="3ro">3ro</option>
            <option value="4to">4to</option>
            <option value="5to">5to</option>
            <option value="Egresado(a)">Egresado(a)</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Colegio</label>
        <input id="f_colegio" type="text">
      </div>
      <div class="field">
        <label>Carrera de interés</label>
        <input id="f_carrera" type="text">
      </div>

      <div class="ficha-actions">
        <button class="btn btn-ghost" id="discardBtn">Descartar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar ficha</button>
      </div>
    </div>
  </div>

  <div class="section-title">Fichas de hoy <span id="listCount">0 registradas</span></div>
  <div class="list" id="list"></div>
  <div class="empty" id="emptyMsg">Aún no registras fichas. Fotografía la primera arriba ↑</div>

  <button class="export-btn" id="exportBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v13m0 0-4-4m4 4 4-4M4 18v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg>
    Exportar a Excel
  </button>

</div>

<script>
const STORAGE_KEY = 'fichas:collected';
let fichas = [];
let pendingFicha = null;

const els = {
  fileInput: document.getElementById('fileInput'),
  statusBox: document.getElementById('statusBox'),
  statusText: document.getElementById('statusText'),
  statusSpinner: document.getElementById('statusSpinner'),
  fichaCard: document.getElementById('fichaCard'),
  list: document.getElementById('list'),
  emptyMsg: document.getElementById('emptyMsg'),
  listCount: document.getElementById('listCount'),
  countLabel: document.getElementById('countLabel'),
  exportBtn: document.getElementById('exportBtn'),
  saveBtn: document.getElementById('saveBtn'),
  discardBtn: document.getElementById('discardBtn'),
};

const fieldIds = ['nombres','dni','celular','email','distrito','grado','colegio','carrera'];

init();

async function init(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    fichas = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    fichas = [];
  }
  renderList();
}

// ===== Cámara en vivo =====
let mediaStream = null;
let facingMode = 'environment';
const cameraOverlay = document.getElementById('cameraOverlay');
const cameraVideo = document.getElementById('cameraVideo');
const cameraCanvas = document.getElementById('cameraCanvas');

els.captureBtn.addEventListener('click', openCamera);
document.getElementById('fallbackLink').addEventListener('click', ()=> els.fileInput.click());
document.getElementById('cameraCancel').addEventListener('click', closeCamera);
document.getElementById('cameraFlip').addEventListener('click', async ()=>{
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  stopStream();
  await startStream();
});
document.getElementById('cameraShutter').addEventListener('click', capturePhoto);

async function openCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    els.fileInput.click();
    return;
  }
  cameraOverlay.classList.add('show');
  try{
    await startStream();
  }catch(err){
    console.error('No se pudo abrir la cámara', err);
    cameraOverlay.classList.remove('show');
    els.fileInput.click();
  }
}

async function startStream(){
  mediaStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facingMode } },
    audio: false
  });
  cameraVideo.srcObject = mediaStream;
}

function stopStream(){
  if(mediaStream){
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

function closeCamera(){
  stopStream();
  cameraOverlay.classList.remove('show');
}

async function capturePhoto(){
  if(!cameraVideo.videoWidth){ return; }
  cameraCanvas.width = cameraVideo.videoWidth;
  cameraCanvas.height = cameraVideo.videoHeight;
  cameraCanvas.getContext('2d').drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);
  const dataUrl = cameraCanvas.toDataURL('image/jpeg', 0.92);
  closeCamera();
  await handleImage({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
}

// ===== Respaldo: elegir archivo del dispositivo =====
els.fileInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const converted = await fileToBase64(file);
  await handleImage(converted);
  els.fileInput.value = '';
});

async function handleImage(imageData){
  setStatus(true, 'Leyendo ficha con IA…', false);
  try{
    const {base64, mediaType} = imageData;
    const extracted = await extractFicha(base64, mediaType);
    fillForm(extracted);
    setStatus(false);
    els.fichaCard.classList.add('show');
    els.fichaCard.scrollIntoView({behavior:'smooth', block:'center'});
  }catch(err){
    console.error(err);
    setStatus(true, 'No se pudo leer la ficha automáticamente. Revisa tu conexión e inténtalo de nuevo, o llena el formulario manualmente.', true);
    fillForm({});
    els.fichaCard.classList.add('show');
  }
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve({
      base64: reader.result.split(',')[1],
      mediaType: file.type || 'image/jpeg'
    });
    reader.onerror = ()=> reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

async function extractFicha(base64, mediaType){
  const prompt = `Esta imagen es una ficha física de datos de un alumno, recolectada en una feria vocacional (formato ZEGEL "TE CONTACTAMOS"). Extrae los siguientes campos y responde SOLAMENTE con un objeto JSON válido, sin texto adicional, sin markdown ni backticks:

{
  "nombres": "",
  "dni": "",
  "email": "",
  "celular": "",
  "distrito": "",
  "colegio": "",
  "grado": "",
  "carrera": ""
}

Reglas:
- "grado" debe ser exactamente uno de: "3ro", "4to", "5to", "Egresado(a)", según cuál esté marcado, subrayado o tenga una X junto a la opción correspondiente (3er/4to/5to/Egresado(a)). Si no es claro, deja "".
- La imagen puede estar rotada 90 grados; lee el texto en la orientación correcta, el formulario es apaisado con el texto en columna vertical.
- Si un campo está vacío, ilegible o no existe en la ficha, usa "".
- Transcribe nombres, colegio, distrito y carrera respetando mayúsculas iniciales tal como estén escritos a mano.
- No inventes datos que no estén en la imagen.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          {type:"image", source:{type:"base64", media_type: mediaType, data: base64}},
          {type:"text", text: prompt}
        ]
      }]
    })
  });
  if(!response.ok) throw new Error('API error ' + response.status);
  const data = await response.json();
  const text = data.content.map(b => b.text || '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

function fillForm(data){
  document.getElementById('f_nombres').value = data.nombres || '';
  document.getElementById('f_dni').value = data.dni || '';
  document.getElementById('f_celular').value = data.celular || '';
  document.getElementById('f_email').value = data.email || '';
  document.getElementById('f_distrito').value = data.distrito || '';
  document.getElementById('f_colegio').value = data.colegio || '';
  document.getElementById('f_carrera').value = data.carrera || '';
  const grado = document.getElementById('f_grado');
  grado.value = ['3ro','4to','5to','Egresado(a)'].includes(data.grado) ? data.grado : '';
}

function setStatus(show, text, isError){
  els.statusBox.classList.toggle('show', !!show);
  els.statusBox.classList.toggle('error', !!isError);
  els.statusSpinner.style.display = isError ? 'none' : 'block';
  if(text) els.statusText.textContent = text;
}

els.saveBtn.addEventListener('click', async ()=>{
  const entry = {
    id: 'f_' + Date.now(),
    ts: new Date().toISOString(),
    nombres: document.getElementById('f_nombres').value.trim(),
    dni: document.getElementById('f_dni').value.trim(),
    celular: document.getElementById('f_celular').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    distrito: document.getElementById('f_distrito').value.trim(),
    grado: document.getElementById('f_grado').value.trim(),
    colegio: document.getElementById('f_colegio').value.trim(),
    carrera: document.getElementById('f_carrera').value.trim(),
  };
  fichas.push(entry);
  await persist();
  renderList();
  els.fichaCard.classList.remove('show');
  setStatus(false);
});

els.discardBtn.addEventListener('click', ()=>{
  els.fichaCard.classList.remove('show');
  setStatus(false);
});

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(fichas), false);
  }catch(e){
    console.error('Error guardando', e);
  }
}

function renderList(){
  els.list.innerHTML = '';
  els.emptyMsg.style.display = fichas.length ? 'none' : 'block';
  els.listCount.textContent = fichas.length + (fichas.length === 1 ? ' registrada' : ' registradas');
  els.countLabel.textContent = fichas.length;
  els.exportBtn.disabled = fichas.length === 0;

  [...fichas].reverse().forEach(f=>{
    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `
      <div class="li-main">
        <div class="li-name">${escapeHtml(f.nombres || 'Sin nombre')}</div>
        <div class="li-sub">${escapeHtml(f.colegio || '—')} · ${escapeHtml(f.grado || '—')}</div>
      </div>
      <button class="li-del" data-id="${f.id}">×</button>
    `;
    els.list.appendChild(item);
  });

  els.list.querySelectorAll('.li-del').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.getAttribute('data-id');
      fichas = fichas.filter(f => f.id !== id);
      await persist();
      renderList();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

els.exportBtn.addEventListener('click', ()=>{
  if(!fichas.length) return;
  const rows = fichas.map(f=>({
    'Nombres y Apellidos': f.nombres,
    'DNI': f.dni,
    'Celular': f.celular,
    'Email': f.email,
    'Distrito': f.distrito,
    'Grado': f.grado,
    'Colegio': f.colegio,
    'Carrera de interés': f.carrera,
    'Fecha registro': new Date(f.ts).toLocaleString('es-PE'),
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:28},{wch:11},{wch:12},{wch:26},{wch:16},{wch:9},{wch:26},{wch:22},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Fichas');
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `fichas_zegel_${fecha}.xlsx`);
});
</script>
</body>
</html>
